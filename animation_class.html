<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS ANIMATION</title>
  </head>
  <style>
    .dim {
      width: 100px;
      height: 100px;
    }

    .obj {
      justify-content: center;
      background-color: aqua;
    }

    .obj2 {
      justify-content: center;
      background-color: rgb(43, 0, 255);
    }

    /* transformtransform-function: ; */

    .my-element {
      /* transform: translate(20px, 30px); */
      /* transform: rotate(45deg); */
    }

    /* CSS animations are defined using @keyframes and the animation property. */

    /* Basic Syntax
    .element {
      animation: animation-name duration timing-function delay iteration-count direction fill-mode;
    }  */

    /* animation-name: slide;
    animation-duration: 2s;
    animation-timing-function: ease-in-out;
    animation-delay: 1s;
    animation-iteration-count: 3;
    animation-direction: alternate;
    animation-fill-mode: forwards; */

    /* Common Timing Functions */
    /* linear
    ease
    ease-in
    ease-out
    ease-in-out
    cubic-bezier(0.42, 0, 0.58, 1) */

    .my-element {
      animation: slideIn 1s ease-in-out;
    }
/* 
    @keyframes slideIn {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(0);
      }
    } */

    .my-element:hover {
      /* transform: translate(20px, 30px); */
      /* transform: translateX(20px); */
      /* transform: translateY(20px); */
      /* transform: scale(1.5) rotate(900deg); */
      /* transform: scale(1.1) ; */
      /* transform: scale(1.02) ; */
      /* 1D */
      /* transform: skewX(10deg); */
      /* transform: skewY(10deg); */
      /* 2D */
      /* transform: skew(10deg, 20deg); */
      /* 3D */
      /* transform: translate3d(20px, 30px, 10px); */
      /* transform: rotate3d(1, 1, 1, 360deg); */
      /* transform: scale3d(2, 1, 0.5); */
      /*  */
      /* transform: translate(50px, 20px) rotate(365deg) scale(1.5); */
      /* transition: transform 0.8s ease-in-out 0.7s;  */
      /* animation: slideIn3 2s ease-in-out 0.5s infinite alternate both; */
    }

    .my-element {
      animation: slideIn3 2s ease-in-out 0.5s infinite alternate both;
    }

    @keyframes slideIn3 {
      0% {
        transform: scaleX(3);
        background-color: green;
      }
      25% {
        transform: scaleX(2);
        background-color: blue;
      }
      50% {
        transform: scaleX(2);
        background-color: rgb(255, 0, 166);
      }
      75% {
        transform: scale(3);
        background-color: rgba(0, 179, 255, 0.575);
      }
      100% {
        transform: scaleX(1);
        background-color: red;
      }
    }

    /* Multiple Animations */
    /* .my-element {
      animation:
        fadeIn 1s ease,
        slideUp 1s ease;
    } */

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
      }

      to {
        transform: translateY(0);
      }
    }
  </style>
  <body>
    <div style="border: 2px solid black">
      <div class="dim obj my-element">box1</div>
      <div class="dim obj2 my-element">box2</div>
    </div>
  </body>
</html>
